name: SafeLog

on:
  workflow_dispatch:
  pull_request:

jobs:
  safelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./
        with:
          path: "examples/sensitive.log"
          fail-on: "block"
          report-format: "both"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: safelog-reports
          path: safelog-reports/
