[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safelog"
version = "0.1.0"
description = "Privacy-first CLI tooling for scanning, redacting, and analyzing logs."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "SafeLog Contributors" }
]
dependencies = [
    "typer>=0.12,<1.0",
    "rich>=13.0,<15.0",
    "tomli>=2.0; python_version < '3.11'",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<7.0",
    "ruff>=0.8",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<7.0",
]

[project.scripts]
safelog = "safelog.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["safelog"]
omit = [
    "src/safelog/ai.py",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
